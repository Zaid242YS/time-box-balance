<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Barakah Time Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: sky band header that follows the prayer segment of the day, tab rail, then a card grid. Timeline is the centre of the planner. */
:root{
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f7f8fd; --ink:#141833; --muted:#5d6385; --line:#e2e5f1;
  --creed:#0f9d76; --craft:#7c4dff; --commerce:#e39b06; --care:#e8437f; --contrib:#0a95d6;
  --gold:#d99a00; --indigo:#4338ca; --good:#12a150; --warn:#e08a00; --bad:#e0413a;
  --sacred-a:#0f766e; --sacred-b:#14b8a6; --sacred-ink:#ffffff;
  --chip:#eef0fa; --shadow:0 1px 2px rgba(20,24,51,.06),0 8px 24px rgba(20,24,51,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-ar:"Amiri","Geeza Pro","Traditional Arabic",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1022; --surface:#161a33; --surface-2:#1b2040; --ink:#eef0ff; --muted:#a2a8cc; --line:#2a3058;
  --creed:#2dd4a7; --craft:#a78bfa; --commerce:#fbbf24; --care:#f472b6; --contrib:#38bdf8;
  --gold:#fbbf24; --indigo:#818cf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --sacred-a:#0f766e; --sacred-b:#0d9488; --chip:#232a52; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1022; --surface:#161a33; --surface-2:#1b2040; --ink:#eef0ff; --muted:#a2a8cc; --line:#2a3058;
  --creed:#2dd4a7; --craft:#a78bfa; --commerce:#fbbf24; --care:#f472b6; --contrib:#38bdf8;
  --gold:#fbbf24; --indigo:#818cf8; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --sacred-a:#0f766e; --sacred-b:#0d9488; --chip:#232a52; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky-a,#1e1b4b)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem} h3{font-size:.98rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--f-ar);font-size:1.15em;direction:rtl}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Sky band */
.sky{background:linear-gradient(120deg,var(--sky-a,#1e1b4b),var(--sky-b,#4338ca) 60%,var(--sky-c,#7c3aed));color:#fff;position:relative;overflow:hidden;transition:background .8s}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 200px at 85% -20%,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.sky .wrap{padding-block:16px 0;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3)}
.brand h1{font-size:1.18rem;font-weight:800}
.brand small{display:block;opacity:.85;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:6px 10px}
button.glass:hover{background:rgba(255,255,255,.26)}
.datebar .date{min-width:0;text-align:center;padding:4px 12px}
.datebar .date b{display:block;font-family:var(--f-display);font-size:.98rem}
.datebar .date span{font-size:.78rem;opacity:.9}
.next-pill{display:flex;align-items:center;gap:10px;padding:6px 12px}
.next-pill .ar{font-size:1.25rem}
.next-pill b{font-family:var(--f-display)}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px 12px 0 0;font-weight:600;white-space:nowrap;opacity:.82;font-size:.92rem}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.1)}
.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}

main.wrap{padding-block:20px 60px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 16%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:var(--r);padding:10px 14px;margin-bottom:16px}
.banner p{margin:0}
.grid{display:grid;gap:16px}
.g-dash{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
@media (max-width:1000px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.eyebrow{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.88rem}
.btn:hover{border-color:var(--indigo)}
.btn.primary{background:linear-gradient(135deg,var(--indigo),#7c3aed);border-color:transparent;color:#fff}
.btn.gold{background:linear-gradient(135deg,#f5b301,#f08a24);border-color:transparent;color:#2a1a00}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:4px 8px;font-size:.8rem;border-radius:8px}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--chip);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.p-creed{--pc:var(--creed)}.p-craft{--pc:var(--craft)}.p-commerce{--pc:var(--commerce)}.p-care{--pc:var(--care)}.p-contrib{--pc:var(--contrib)}
.pc-dot{background:var(--pc)}
.pc-chip{background:color-mix(in srgb,var(--pc) 16%,transparent);color:color-mix(in srgb,var(--pc) 75%,var(--ink))}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical}
label.f{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

/* Dashboard hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:620px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:180px;height:180px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .center b{font-family:var(--f-display);font-size:2.8rem;line-height:1}
.ring .center span{font-size:.78rem;color:var(--muted);font-weight:600}
.grade{font-family:var(--f-display);font-size:1.4rem;font-weight:800;background:linear-gradient(90deg,var(--creed),var(--contrib),var(--craft));-webkit-background-clip:text;background-clip:text;color:transparent}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:12px}
.comp{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.comp .lbl{font-size:.74rem;color:var(--muted);font-weight:600}
.comp b{font-family:var(--f-display);font-size:1.3rem}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--indigo))}

.next-card{background:linear-gradient(140deg,var(--sacred-a),var(--sacred-b));color:#fff;border:none}
.next-card .ar{font-size:2.3rem;line-height:1.1}
.next-card .count{font-family:var(--f-display);font-size:2.2rem;font-weight:800;letter-spacing:-.02em}
.next-card .muted{color:rgba(255,255,255,.85)}
.chain{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chain span{padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);font-size:.76rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.chain span.ok{background:#fff;color:var(--sacred-a)}
.chain span.late{background:#fde68a;color:#5b3d00}
.chain span.miss{background:#fecaca;color:#7f1d1d}

/* checkpoint pipeline */
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:900px){.pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cp{border-radius:12px;border:1px solid var(--line);padding:10px;background:var(--surface-2);position:relative;min-width:0}
.cp .st{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cp b{font-family:var(--f-display);display:block;font-size:.92rem}
.cp.due{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.cp.due .st{color:var(--warn)}
.cp.closed{border-color:color-mix(in srgb,var(--good) 50%,var(--line));background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.cp.closed .st{color:var(--good)}
.cp.live{border-color:var(--indigo);box-shadow:0 0 0 3px color-mix(in srgb,var(--indigo) 18%,transparent)}
.cp.live .st{color:var(--indigo)}

.check-list{display:grid;gap:8px}
.check-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.check-item .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.col-right .check-item,.narrow .check-item{grid-template-columns:auto minmax(0,1fr)}
.col-right .check-item .ctl{grid-column:2;justify-content:flex-start}
@media (max-width:560px){.check-item{grid-template-columns:auto minmax(0,1fr)}.check-item .ctl{grid-column:2;justify-content:flex-start}}
.check-item .t{font-weight:600;overflow-wrap:anywhere}
.check-item .s{font-size:.76rem;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 8px;font-size:.78rem;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v="done"],.seg button.on[data-v="jamaah"],.seg button.on[data-v="ontime"]{background:var(--good);color:#fff}
.seg button.on[data-v="partial"],.seg button.on[data-v="late"],.seg button.on[data-v="qada"]{background:var(--warn);color:#fff}
.seg button.on[data-v="missed"]{background:var(--bad);color:#fff}
.stars{display:inline-flex;gap:1px}
.stars button{border:0;background:none;padding:0 1px;color:var(--line);font-size:1rem;line-height:1}
.stars button.on{color:var(--gold)}
.status-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;background:var(--muted)}
.status-ic.done{background:var(--good)}.status-ic.partial{background:var(--warn)}.status-ic.missed{background:var(--bad)}.status-ic.pending{background:color-mix(in srgb,var(--muted) 45%,var(--line))}

/* planner */
.planner{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:1180px){.planner{grid-template-columns:minmax(0,1fr) 320px}.planner .col-left{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}}
@media (max-width:820px){.planner{grid-template-columns:minmax(0,1fr)}}
.col-left,.col-right{display:grid;gap:16px;min-width:0}
.prio{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.prio .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;color:#fff;background:linear-gradient(135deg,var(--gold),#f08a24)}
.dump-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:grab}
.dump-item .t{overflow-wrap:anywhere;font-weight:500}
.dump-item.boxed{opacity:.55}
.dump-add{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:10px}
.dump-add .row2{grid-column:1 / -1;display:grid;grid-template-columns:1fr 92px;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--indigo)}
.icon-btn svg{width:15px;height:15px}

.tl-card{padding:0;overflow:hidden}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.tl-scroll{max-height:76vh;overflow-y:auto;overflow-x:hidden;position:relative}
.tl{position:relative;margin:8px 0 16px}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.tl .hr.half{border-top-style:dashed;opacity:.6}
.tl .hr span{position:absolute;left:10px;top:-9px;font-size:.72rem;color:var(--muted);background:var(--surface);padding:0 4px;font-variant-numeric:tabular-nums}
.tl .lane{position:absolute;left:68px;right:10px;top:0;bottom:0}
.blk{position:absolute;border-radius:10px;padding:4px 8px;overflow:hidden;font-size:.8rem;line-height:1.25;user-select:none;min-height:20px}
.blk.sacred{left:0;right:0;background:repeating-linear-gradient(135deg,var(--sacred-a),var(--sacred-a) 10px,color-mix(in srgb,var(--sacred-a) 85%,var(--sacred-b)) 10px,color-mix(in srgb,var(--sacred-a) 85%,var(--sacred-b)) 20px);color:var(--sacred-ink);display:flex;align-items:center;gap:8px;z-index:2;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.blk.sacred.nafl{background:linear-gradient(135deg,#312e81,#6d28d9);}
.blk.sacred .ar{font-size:1.05rem}
.blk.sacred b{font-family:var(--f-display)}
.blk.sacred .lock{margin-left:auto;opacity:.85;display:flex;align-items:center;gap:4px;font-size:.72rem}
.blk.box{background:color-mix(in srgb,var(--pc) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 55%,transparent);border-left:4px solid var(--pc);cursor:grab;z-index:3;touch-action:none}
.blk.box:hover{box-shadow:0 4px 14px rgba(20,24,51,.18)}
.blk.box.dragging{opacity:.85;cursor:grabbing;z-index:9;box-shadow:0 10px 30px rgba(20,24,51,.3)}
.blk.box .bt{font-weight:700;display:flex;gap:6px;align-items:center}
.blk.box .bt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk.box .bm{font-size:.72rem;color:var(--muted)}
.blk.box.done{opacity:.78}.blk.box.done .bt span{text-decoration:line-through}
.blk.box.missed{border-left-color:var(--bad);opacity:.7}
.blk.box.conflict{outline:2px dashed var(--bad);outline-offset:1px}
.blk .tag{font-size:.66rem;font-weight:800;background:var(--bad);color:#fff;border-radius:6px;padding:0 5px}
.blk .star{color:var(--gold)}
.marker{position:absolute;left:68px;right:10px;height:0;border-top:2px dotted color-mix(in srgb,var(--craft) 70%,transparent);z-index:1}
.marker span{position:absolute;right:0;top:-10px;font-size:.68rem;background:var(--surface);color:var(--craft);font-weight:700;padding:0 4px}
.nowline{position:absolute;left:58px;right:0;height:0;border-top:2px solid var(--bad);z-index:8}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.tl.drop-hover{background:color-mix(in srgb,var(--indigo) 6%,transparent)}

/* salah page */
.prayer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);display:grid;gap:8px}
.pcard.now{border-color:var(--sacred-b);box-shadow:0 0 0 3px color-mix(in srgb,var(--sacred-b) 25%,transparent)}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .ar{font-size:1.6rem;color:var(--creed)}
.pcard .time{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.week{width:100%;border-collapse:collapse;font-size:.84rem}
.week th,.week td{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
.week th:first-child,.week td:first-child{text-align:left}
.pd{width:16px;height:16px;border-radius:5px;display:inline-block;background:var(--line)}
.pd.jamaah{background:var(--creed)}.pd.ontime{background:var(--good)}.pd.late{background:var(--warn)}.pd.qada{background:color-mix(in srgb,var(--warn) 55%,var(--bad))}.pd.missed{background:var(--bad)}
.tablewrap{overflow-x:auto}

/* model page */
.thesis{background:linear-gradient(130deg,#0b3b3a,#134e4a 40%,#4c1d95);color:#fff;border:none;padding:28px}
.thesis h2{font-size:clamp(1.4rem,3vw,2.2rem);max-width:24ch}
.thesis p{max-width:64ch;opacity:.92}
.thesis .q{border-left:3px solid #fbbf24;padding-left:12px;margin-top:14px;font-size:.95rem}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:760px){.flow{grid-template-columns:1fr}}
.flow .st{border-radius:14px;padding:14px;color:#fff;position:relative}
.flow .st b{font-family:var(--f-display);font-size:1.1rem;display:block}
.flow .st small{opacity:.9}
.foundation{margin-top:10px;border-radius:14px;padding:12px 14px;background:linear-gradient(90deg,var(--care),color-mix(in srgb,var(--care) 60%,var(--craft)));color:#fff}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
.cmp th{text-align:left;padding:10px;font-family:var(--f-display)}
.cmp td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.cmp td:first-child{color:var(--muted)}
.cmp td:last-child{font-weight:600}
.imp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.imp .card{box-shadow:none;border-top:4px solid var(--pc)}
.imp .src{font-size:.76rem;color:var(--muted);margin-top:6px}
.align-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin-bottom:8px}
.conduct{display:grid;gap:8px}
.conduct label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}

/* modal */
.modal-back{position:fixed;inset:0;background:rgba(10,12,30,.55);display:grid;place-items:center;z-index:50;padding:16px}

<script>
(function(){
"use strict";
/* ---------- utilities ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dateOf=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d,12)};
const addDays=(k,n)=>{const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)};
const todayKey=()=>keyOf(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const LS="barakah-timebox-v1";

const PILLARS={
  creed:{name:"Creed",sub:"Ibadah, Quran, dhikr",cls:"p-creed",hex:"#0f9d76"},
  craft:{name:"Craft",sub:"Learning, skill, deep work",cls:"p-craft",hex:"#7c4dff"},
  commerce:{name:"Commerce",sub:"Earning, clients, operations",cls:"p-commerce",hex:"#e39b06"},
  care:{name:"Care",sub:"Family, health, rest",cls:"p-care",hex:"#e8437f"},
  contrib:{name:"Contribution",sub:"Sadaqah, community, mentoring",cls:"p-contrib",hex:"#0a95d6"}
};
const FARD=["fajr","dhuhr","asr","maghrib","isha"];
const PNAME={fajr:"Fajr",sunrise:"Sunrise",duha:"Duha",dhuhr:"Dhuhr",jumuah:"Jumu'ah",asr:"Asr",maghrib:"Maghrib",isha:"Isha",tahajjud:"Tahajjud"};
const PAR={fajr:"الفجر",sunrise:"الشروق",duha:"الضحى",dhuhr:"الظهر",jumuah:"الجمعة",asr:"العصر",maghrib:"المغرب",isha:"العشاء",tahajjud:"التهجد"};
const PSTAT=[["jamaah","Jama'ah",1],["ontime","On time",.9],["late","Late",.5],["qada","Qada",.25],["missed","Missed",0]];
const PVAL=Object.fromEntries(PSTAT.map(s=>[s[0],s[2]]));
const CONDUCT=[
  ["truth","Spoke truthfully in every deal and message"],
  ["amanah","Kept my commitments and deadlines (amanah)"],
  ["fair","Gave full measure: fair price, fair effort, fair pay"],
  ["clean","Kept earnings clear of riba, deception and doubtful gain"],
  ["give","Gave something today: sadaqah, time or help"]
];
const METHODS={
  mwl:{name:"Muslim World League",fajr:18,isha:17},
  isna:{name:"ISNA (North America)",fajr:15,isha:15},
  egypt:{name:"Egyptian General Authority",fajr:19.5,isha:17.5},
  makkah:{name:"Umm al-Qura, Makkah",fajr:18.5,ishaMin:90},
  karachi:{name:"University of Islamic Sciences, Karachi",fajr:18,isha:18},
  gulf:{name:"Gulf Region",fajr:19.5,ishaMin:90},
  jakim:{name:"JAKIM (Malaysia)",fajr:20,isha:18},
  diyanet:{name:"Diyanet (Turkey)",fajr:18,isha:17}
};
const CITIES=[
  ["Makkah",21.4225,39.8262,"makkah","Asia/Riyadh"],["Madinah",24.4686,39.6142,"makkah",""],["Riyadh",24.7136,46.6753,"makkah",""],["Dubai",25.2048,55.2708,"gulf","Asia/Dubai"],
  ["Cairo",30.0444,31.2357,"egypt","Africa/Cairo"],["Istanbul",41.0082,28.9784,"diyanet","Europe/Istanbul"],["London",51.5072,-0.1276,"mwl","Europe/London"],
  ["New York",40.7128,-74.006,"isna","America/New_York"],["Chicago",41.8781,-87.6298,"isna","America/Chicago"],["Houston",29.7604,-95.3698,"isna",""],
  ["Los Angeles",34.0522,-118.2437,"isna","America/Los_Angeles"],["Toronto",43.6532,-79.3832,"isna","America/Toronto"],
  ["Karachi",24.8607,67.0011,"karachi","Asia/Karachi"],["Lahore",31.5204,74.3587,"karachi",""],["Dhaka",23.8103,90.4125,"karachi","Asia/Dhaka"],
  ["Jakarta",-6.2088,106.8456,"mwl","Asia/Jakarta"],["Kuala Lumpur",3.139,101.6869,"jakim","Asia/Kuala_Lumpur"],["Lagos",6.5244,3.3792,"mwl","Africa/Lagos"],
  ["Sydney",-33.8688,151.2093,"mwl","Australia/Sydney"],["Paris",48.8566,2.3522,"mwl","Europe/Paris"],["Berlin",52.52,13.405,"mwl","Europe/Berlin"]
];

/* ---------- state ---------- */
function defaultSettings(){
  let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""}catch(e){}
  const c=CITIES.find(c=>c[4]&&c[4]===tz)||CITIES[0];
  return {city:c[0],lat:c[1],lng:c[2],method:c[3],asr:"standard",wudu:10,dur:{fajr:15,dhuhr:20,asr:15,maghrib:15,isha:20},
    jumuah:true,jumuahDur:60,tahajjud:true,duha:true,h24:false,theme:"auto",seeded:false,sampleDismissed:false,guessed:!(c[4]&&c[4]===tz)};
}
const S={settings:defaultSettings(),days:{}};
let viewKey=todayKey();
let route="dashboard";
function newDay(){return{intention:"",priorities:[{t:"",d:false},{t:"",d:false},{t:"",d:false}],dump:[],boxes:[],prayers:{},nafl:{},conduct:{},reflection:""}}
function getDay(k,create=true){if(!S.days[k]&&create)S.days[k]=newDay();return S.days[k]||newDay()}

/* ---------- prayer engine (astronomical) ---------- */
const D2R=Math.PI/180,R2D=180/Math.PI;
const dsin=d=>Math.sin(d*D2R),dcos=d=>Math.cos(d*D2R),dtan=d=>Math.tan(d*D2R);
const fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*dsin(g)+.02*dsin(2*g),360),e=23.439-.00000036*D;
  const RA=fix(Math.atan2(dcos(e)*dsin(L),dcos(L))*R2D/15,24);return{decl:Math.asin(dsin(e)*dsin(L))*R2D,eqt:q/15-RA}}
const ptCache={};
function prayerTimes(k){
  const s=S.settings,ck=k+"|"+s.lat+"|"+s.lng+"|"+s.method+"|"+s.asr;if(ptCache[ck])return ptCache[ck];
  const d=dateOf(k),M=METHODS[s.method]||METHODS.mwl,lat=+s.lat,lng=+s.lng;
  const tz=-d.getTimezoneOffset()/60, jd0=julian(d.getFullYear(),d.getMonth()+1,d.getDate())-lng/(15*24);
  const midDay=t=>{const e=sunPos(jd0+t).eqt;return fix(12-e,24)};
  const sunAngle=(ang,t,ccw)=>{const decl=sunPos(jd0+t).decl,noon=midDay(t);const v=(-dsin(ang)-dsin(decl)*dsin(lat))/(dcos(decl)*dcos(lat));const T=Math.acos(v)*R2D/15;return noon+(ccw?-T:T)};
  const asrT=(f,t)=>{const decl=sunPos(jd0+t).decl;const ang=-Math.atan(1/(f+dtan(Math.abs(lat-decl))))*R2D;return sunAngle(ang,t)};
  let T={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18};
  for(let i=0;i<2;i++){const p={};for(const x in T)p[x]=(isNaN(T[x])?12:T[x])/24;
    T={fajr:sunAngle(M.fajr,p.fajr,true),sunrise:sunAngle(.833,p.sunrise,true),dhuhr:midDay(p.dhuhr),asr:asrT(s.asr==="hanafi"?2:1,p.asr),sunset:sunAngle(.833,p.sunset),isha:M.ishaMin?NaN:sunAngle(M.isha,p.isha)}}
  for(const x in T)T[x]+=tz-lng/15;
  const night=24-T.sunset+T.sunrise;
  if(isNaN(T.fajr)||T.sunrise-T.fajr>night*M.fajr/60)T.fajr=T.sunrise-night*M.fajr/60;
  if(M.ishaMin)T.isha=T.sunset+M.ishaMin/60;else if(isNaN(T.isha)||T.isha-T.sunset>night*M.isha/60)T.isha=T.sunset+night*M.isha/60;
  T.dhuhr+=1/60;T.maghrib=T.sunset+1/60;
  const r={};for(const x in T)r[x]=Math.round(fix(T[x],24)*60);
  const nightLen=1440-r.maghrib+r.fajr;
  r.lastThird=Math.round(r.fajr-nightLen/3);r.midnight=Math.round((r.maghrib+nightLen/2)%1440);r.duha=r.sunrise+20;
  ptCache[ck]=r;return r;
}
function isFriday(k){return dateOf(k).getDay()===5}
function sacredBlocks(k){
  const s=S.settings,t=prayerTimes(k),w=+s.wudu||0,out=[];
  if(s.tahajjud){const st=Math.max(t.lastThird,t.fajr-75);out.push({key:"tahajjud",nafl:true,time:st,start:st,dur:Math.min(45,t.fajr-st-10)})}
  for(const p of FARD){let key=p,dur=+s.dur[p]||15;if(p==="dhuhr"&&s.jumuah&&isFriday(k)){key="jumuah";dur=+s.jumuahDur||60}
    out.push({key,fard:p,time:t[p],start:t[p]-w,dur:dur+w})}
  if(s.duha)out.push({key:"duha",nafl:true,time:t.duha,start:t.duha,dur:15});
  return out.sort((a,b)=>a.start-b.start);
}
function tlRange(k){const t=prayerTimes(k);const start=Math.max(0,Math.floor((Math.min(t.fajr-90,S.settings.tahajjud?Math.max(t.lastThird,t.fajr-75)-15:9999))/60)*60);return{start,end:1440}}
function segments(k){
  const t=prayerTimes(k),r=tlRange(k);
  return [
    {id:"night",name:"Pre-dawn",ar:"السحر",from:r.start,to:t.fajr,cp:"Fajr"},
    {id:"morning",name:"Fajr to Dhuhr",ar:"البكور",from:t.fajr,to:t.dhuhr,cp:isFriday(k)&&S.settings.jumuah?"Jumu'ah":"Dhuhr"},
    {id:"noon",name:"Dhuhr to Asr",ar:"الظهيرة",from:t.dhuhr,to:t.asr,cp:"Asr"},
    {id:"aft",name:"Asr to Maghrib",ar:"العصر",from:t.asr,to:t.maghrib,cp:"Maghrib"},
    {id:"eve",name:"Maghrib to Isha",ar:"المساء",from:t.maghrib,to:t.isha,cp:"Isha"},
    {id:"late",name:"After Isha",ar:"الليل",from:t.isha,to:1440,cp:"Night review"}
  ];
}
function segStatus(k,seg){
  const tk=todayKey(),boxes=getDay(k,false).boxes.filter(b=>b.start>=seg.from&&b.start<seg.to);
  const pending=boxes.filter(b=>b.status==="pending").length;
  let st;
  if(k>tk)st="upcoming";else if(k<tk)st=pending?"due":"closed";
  else{const n=nowMin();st=n<seg.from?"upcoming":n<seg.to?"live":(pending?"due":"closed")}
  return{boxes,pending,st};
}

/* ---------- formatting ---------- */
function fmt(min){min=Math.round(min);min=((min%1440)+1440)%1440;const h=Math.floor(min/60),m=min%60;
  if(S.settings.h24)return pad(h)+":"+pad(m);return ((h%12)||12)+":"+pad(m)+(h<12?" AM":" PM")}
const hhmm=min=>{min=((Math.round(min)%1440)+1440)%1440;return pad(Math.floor(min/60))+":"+pad(min%60)};
const parseHM=s=>{const[a,b]=String(s||"0:0").split(":").map(Number);return (a||0)*60+(b||0)};
function hijri(k){const d=dateOf(k);for(const c of["islamic-umalqura","islamic"]){try{return new Intl.DateTimeFormat("en-u-ca-"+c,{day:"numeric",month:"long",year:"numeric"}).format(d)}catch(e){}}return""}
const longDate=k=>dateOf(k).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const shortDate=k=>dateOf(k).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const durTxt=m=>m>=60?(Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":"")):m+"m";

/* ---------- scheduling helpers ---------- */
function overlaps(a,b){return a.start<b.start+b.dur&&b.start<a.start+a.dur}
function conflictOf(k,box){return sacredBlocks(k).find(s=>overlaps(s,box))}
function findFree(k,dur,from,ignoreId){
  const r=tlRange(k),occ=sacredBlocks(k).concat(getDay(k).boxes.filter(b=>b.id!==ignoreId));
  let t=Math.max(r.start,Math.ceil(from/15)*15);
  while(t+dur<=r.end){const c={start:t,dur};const hit=occ.find(o=>overlaps(o,c));if(!hit)return t;t=Math.ceil((hit.start+hit.dur)/15)*15}
  return null;
}

/* ---------- scoring ---------- */
const W={box:.35,salah:.30,prio:.20,focus:.15};
function gradeOf(s){if(s==null)return["Not started","Plan and check your boxes to earn a score."];if(s>=90)return["Ihsan","Excellence: worship and work both at their best."];if(s>=75)return["Itqan","Mastery: strong, consistent execution."];if(s>=60)return["Steady","Solid day. Tighten one checkpoint."];if(s>=40)return["Rebuilding","Recover at the next prayer checkpoint."];return["Fresh start","Every prayer is a reset. Start at the next one."]}
function dayStats(k){
  const tk=todayKey(),day=getDay(k,false),isToday=k===tk,future=k>tk,n=nowMin(),t=prayerTimes(k);
  const due=future?[]:day.boxes.filter(b=>!isToday||b.start+b.dur<=n||b.status!=="pending");
  const boxV=due.length?due.reduce((a,b)=>a+(b.status==="done"?1:b.status==="partial"?.5:0),0)/due.length:null;
  const pDue=future?[]:FARD.filter(p=>!isToday||t[p]<=n);
  const salah=pDue.length?pDue.reduce((a,p)=>a+(PVAL[day.prayers[p]]??0),0)/pDue.length:null;
  const filled=day.priorities.filter(p=>p.t.trim());
  const prio=filled.length&&!future?filled.filter(p=>p.d).length/filled.length:null;
  const rated=day.boxes.filter(b=>b.focus>0);
  const focus=rated.length?rated.reduce((a,b)=>a+b.focus,0)/rated.length/5:null;
  const comps={box:boxV,salah,prio,focus};let num=0,den=0;for(const c in comps)if(comps[c]!=null){num+=W[c]*comps[c];den+=W[c]}
  const bonus=(day.nafl.tahajjud?5:0)+(day.nafl.duha?3:0);
  const score=den?Math.min(100,Math.round(num/den*100+bonus)):null;
  const byP={};for(const p in PILLARS)byP[p]={plan:0,done:0};
  for(const b of day.boxes){byP[b.pillar].plan+=b.dur;byP[b.pillar].done+=b.status==="done"?b.dur:b.status==="partial"?b.dur/2:0}
  const prayerMin=FARD.reduce((a,p)=>a+(day.prayers[p]&&day.prayers[p]!=="missed"?(+S.settings.dur[p]||15):0),0)+(day.nafl.tahajjud?40:0)+(day.nafl.duha?15:0);
  const creedMin=byP.creed.done+prayerMin,commerceMin=byP.commerce.done;
  const conflicts=day.boxes.filter(b=>conflictOf(k,b)).length;
  const totalMin=day.boxes.reduce((a,b)=>a+b.dur,0)+prayerMin;
  const c2c={
    anchor:day.boxes.length?1-conflicts/day.boxes.length:(future?null:1),
    early:day.boxes.some(b=>(b.pillar==="commerce"||b.pillar==="craft")&&b.start>=t.fajr&&b.start<t.sunrise+180)?1:0,
    creedShare:totalMin?Math.min(1,(byP.creed.plan+prayerMin)/totalMin/.2):0,
    integrity:CONDUCT.filter(c=>day.conduct[c[0]]).length/CONDUCT.length,
    contrib:day.boxes.some(b=>b.pillar==="contrib"&&b.status==="done")?1:day.boxes.some(b=>b.pillar==="contrib")?.5:0
  };
  const cv=Object.values(c2c).filter(v=>v!=null);const alignment=cv.length?Math.round(cv.reduce((a,b)=>a+b,0)/cv.length*100):null;
  return{score,comps,bonus,grade:gradeOf(score),byP,prayerMin,creedMin,commerceMin,conflicts,c2c,alignment,
    boxes:day.boxes.length,done:day.boxes.filter(b=>b.status==="done").length,pending:day.boxes.filter(b=>b.status==="pending").length,
    prayersOk:FARD.filter(p=>["jamaah","ontime"].includes(day.prayers[p])).length};
}

function seedSample(){
  const tk=todayKey();let rnd=7;const rand=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
  const plan=[
    ["Morning adhkar and Quran (2 pages)","creed","fajr",15,30],
    ["Walk and stretch","care","sunrise",15,30],
    ["Deep work: Q1 pricing model for date imports","craft","sunrise",60,90],
    ["Client proposal: wholesale order for Al-Noor Grocers","commerce","sunrise",165,90],
    ["Team stand-up","commerce","dhuhr",-75,30],
    ["Qaylulah (midday rest)","care","dhuhr",-40,20],
    ["Sales calls: 5 prospects","commerce","dhuhr",35,90],
    ["Invoice follow-ups and bookkeeping","commerce","asr",25,45],
    ["Course: financial accounting, lesson 4","craft","asr",75,45],
    ["Dinner with family","care","maghrib",25,45],
    ["Tafsir circle at the masjid","creed","isha",-5,0],
    ["Mentor call with a student founder","contrib","isha",30,30],
    ["Plan tomorrow and evening adhkar","creed","isha",65,20]
  ];
  for(let i=6;i>=0;i--){
    const k=addDays(tk,-i),d=newDay(),t=prayerTimes(k),isToday=i===0,n=nowMin();d.sample=true;S.days[k]=d;
    d.intention="Earn with honesty, serve my family, and keep every prayer on time.";
    d.priorities=[{t:"Send the Al-Noor wholesale proposal",d:false},{t:"Close 2 of 5 sales calls",d:false},{t:"Finish accounting lesson 4",d:false}];
    for(const [title,pillar,anchor,off,dur0] of plan){
      if(title.startsWith("Tafsir")&&dateOf(k).getDay()!==4)continue;
      const dur=dur0||45;let st=(anchor==="sunrise"?t.sunrise:t[anchor])+off;st=Math.round(st/15)*15;
      const free=findFree(k,dur,st);if(free==null)continue;
      const b={id:uid(),title,pillar,start:free,dur,status:"pending",focus:0,priority:/proposal|Sales calls|lesson 4/.test(title),note:"",sample:true};
      if(!isToday||free+dur<=n){const r=rand();b.status=r<.68?"done":r<.86?"partial":"missed";b.focus=b.status==="missed"?0:3+Math.round(rand()*2)}
      d.boxes.push(b);
    }
    d.dump=[{id:uid(),text:"Draft supplier contract renewal",pillar:"commerce",est:60,sample:true},{id:uid(),text:"Call parents",pillar:"care",est:20,sample:true},{id:uid(),text:"Review zakat calculation for the business",pillar:"contrib",est:45,sample:true},{id:uid(),text:"Memorise Surah Al-Mulk, verses 1-5",pillar:"creed",est:20,sample:true}];
    for(const p of FARD){if(isToday&&t[p]>n)continue;const r=rand();d.prayers[p]=r<.35?"jamaah":r<.8?"ontime":r<.93?"late":"qada"}
    if(!isToday||t.fajr<n){d.nafl.tahajjud=rand()<.55;d.nafl.duha=rand()<.6}
    d.priorities.forEach(p=>{p.d=!isToday&&rand()<.7});
    if(!isToday){CONDUCT.forEach(c=>{d.conduct[c[0]]=rand()<.8});d.reflection="Productive morning after Fajr. Sales calls ran long; protect the Asr checkpoint tomorrow."}
  }
}
function hasSample(){return Object.values(S.days).some(d=>d.sample||d.boxes.some(b=>b.sample)||d.dump.some(x=>x.sample))}
function removeSample(){
  for(const k in S.days){const d=S.days[k];d.boxes=d.boxes.filter(b=>!b.sample);d.dump=d.dump.filter(x=>!x.sample);
    if(d.sample&&!d.touched){const n=newDay();n.boxes=d.boxes;n.dump=d.dump;S.days[k]=n}else delete d.sample;
    const nd=S.days[k];if(!nd.boxes.length&&!nd.dump.length&&!nd.intention&&!Object.keys(nd.prayers).length&&!nd.priorities.some(p=>p.t))delete S.days[k];
    dirty.add(k);
  }
  S.settings.sampleDismissed=true;dirtySettings=true;save();
}

/* ---------- persistence: localStorage always, private db rows when signed in ---------- */
let dirty=new Set(),dirtySettings=false,saveTimer=null,dbApi=null,userId=null,writing=false,firstSave=true;
function touch(k,own){const d=getDay(k);if(own)d.touched=true;dirty.add(k);save()}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,500)}
async function flush(){
  if(firstSave){firstSave=false;S.settings.seeded=true;dirtySettings=true;Object.keys(S.days).forEach(k=>dirty.add(k))}
  lsSet(LS,JSON.stringify(S));
  if(!dbApi||!userId||writing){dirty.clear();dirtySettings=false;return}
  writing=true;
  try{
    const base="data/users/"+userId;
    if(dirtySettings){dirtySettings=false;await dbApi.doc(base+"/settings").set({settings:JSON.stringify(S.settings)})}
    const keys=[...dirty];dirty.clear();
    for(const k of keys){const ref=dbApi.doc(base+"/day-"+k);if(S.days[k])await ref.set({key:k,day:JSON.stringify(S.days[k])});else await ref.delete().catch(()=>{})}
  }catch(e){console.warn("Save to account storage failed",e)}
  writing=false;if(dirty.size||dirtySettings)save();
}
function loadLocal(){
  const raw=lsGet(LS);if(!raw)return false;
  try{const o=JSON.parse(raw);if(o&&o.settings){S.settings=Object.assign(defaultSettings(),o.settings);S.days=o.days||{};return true}}catch(e){}
  return false;
}
async function connectDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    dbApi=db;userId=id;
    const snap=await Promise.race([db.collection("data/users/"+id).get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    if(snap.empty){if(S.settings.seeded){dirtySettings=true;Object.keys(S.days).forEach(k=>dirty.add(k));save()}return}
    const days={};let settings=null;
    for(const doc of snap.docs){const v=doc.data()||{};try{if(doc.id==="settings")settings=JSON.parse(v.settings);else if(v.key&&v.day)days[v.key]=JSON.parse(v.day)}catch(e){}}
    if(settings){S.settings=Object.assign(defaultSettings(),settings);firstSave=false}
    S.days=days;lsSet(LS,JSON.stringify(S));applyTheme();render();toast("Synced with your account");
  }catch(e){console.warn("Account storage unavailable",e)}
}

    bars+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="${d===k?700:400}">${dateOf(d).toLocaleDateString(undefined,{weekday:"short"})}</text>`;
    if(s.comps.salah!=null)pts.push([x+w/2,y(s.comps.salah*100)]);});

  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--surface)" stroke="var(--creed)" stroke-width="2"/>`).join("");

}

const PPM=1.5;
function layoutLanes(boxes){
  const sorted=[...boxes].sort((a,b)=>a.start-b.start||b.dur-a.dur),out=new Map();let cluster=[],end=-1;
  const finish=()=>{const lanes=[];for(const b of cluster){let i=lanes.findIndex(e=>e<=b.start);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=b.start+b.dur;out.set(b.id,{lane:i})}for(const b of cluster)out.get(b.id).n=lanes.length};
  for(const b of sorted){if(b.start>=end&&cluster.length){finish();cluster=[]}cluster.push(b);end=Math.max(end,b.start+b.dur)}if(cluster.length)finish();return out;
}
function mountTimeline(){
  const k=viewKey,tl=$("#tl"),r=tlRange(k),day=getDay(k,false),t=prayerTimes(k),y=m=>(m-r.start)*PPM;
  tl.style.height=(r.end-r.start)*PPM+"px";
  let h="";for(let m=Math.ceil(r.start/30)*30;m<r.end;m+=30)h+=`<div class="hr ${m%60?"half":""}" style="top:${y(m)}px">${m%60?"":`<span>${fmt(m)}</span>`}</div>`;
  h+=`<div class="lane" id="lane">`;
  for(const s of sacredBlocks(k))h+=`<div class="blk sacred ${s.nafl?"nafl":""}" style="top:${y(s.start)}px;height:${Math.max(20,s.dur*PPM-2)}px" title="${PNAME[s.key]} at ${fmt(s.time)}"><span class="ar">${PAR[s.key]}</span><b>${PNAME[s.key]}</b><span class="num">${fmt(s.time)}</span><span class="lock">${I.lock}${s.nafl?"Sunnah":s.key==="jumuah"?"Jumu'ah":"Fard"}${s.fard?" · wudu "+S.settings.wudu+"m":""}</span></div>`;
  const lanes=layoutLanes(day.boxes);
  for(const b of day.boxes){const L=lanes.get(b.id),w=100/L.n,cf=conflictOf(k,b),p=PILLARS[b.pillar],hpx=Math.max(22,b.dur*PPM-2);
    h+=`<div class="blk box ${p.cls} ${b.status} ${cf?"conflict":""}" data-box="${b.id}" style="top:${y(b.start)}px;height:${hpx}px;left:calc(${L.lane*w}% + 2px);width:calc(${w}% - 4px)" tabindex="0" role="button" aria-label="${esc(b.title)}, ${fmt(b.start)}">
      <div class="bt">${b.priority?'<b class="star">★</b>':""}<span>${esc(b.title)}</span>${cf?`<em class="tag">Clashes with ${PNAME[cf.key]}</em>`:""}</div>${hpx>36?`<div class="bm num">${fmt(b.start)} – ${fmt(b.start+b.dur)} · ${p.name}${b.status!=="pending"?" · "+b.status:""}</div>`:""}</div>`}
  h+=`</div>`;
  if(t.lastThird>r.start&&t.lastThird<t.fajr)h+=`<div class="marker" style="top:${y(t.lastThird)}px"><span>Last third of night · ${fmt(t.lastThird)}</span></div>`;
  h+=`<div class="marker" style="top:${y(t.midnight<t.maghrib?t.midnight+1440:t.midnight)}px;${t.midnight<t.maghrib?"display:none":""}"><span>Isha preferred until ${fmt(t.midnight)}</span></div>`;
  if(k===todayKey()){const n=nowMin();if(n>=r.start)h+=`<div class="nowline" style="top:${y(n)}px"></div>`}
  tl.innerHTML=h;
  const sc=$("#tlScroll");const focusAt=k===todayKey()?nowMin()-90:t.fajr-30;sc.scrollTop=Math.max(0,y(focusAt));
  // click empty space -> new box
  tl.addEventListener("click",e=>{if(e.target.closest(".blk"))return;const lane=$("#lane"),rect=lane.getBoundingClientRect();const m=Math.floor(((e.clientY-rect.top)/PPM+r.start)/15)*15;
    const s=sacredBlocks(k).find(s=>m>=s.start&&m<s.start+s.dur);if(s){toast(`${fmt(s.start)} is reserved for ${PNAME[s.key]}`);return}openBox(null,m)});
  tl.addEventListener("click",e=>{const s=e.target.closest(".blk.sacred");if(s){e.stopPropagation();location.hash="#salah"}});
  // drag dump items
  tl.addEventListener("dragover",e=>{e.preventDefault();tl.classList.add("drop-hover")});
  tl.addEventListener("dragleave",()=>tl.classList.remove("drop-hover"));
  tl.addEventListener("drop",e=>{e.preventDefault();tl.classList.remove("drop-hover");const id=e.dataTransfer.getData("text/plain");const x=day.dump.find(d=>d.id===id);if(!x)return;
    const rect=$("#lane").getBoundingClientRect();let m=Math.round(((e.clientY-rect.top)/PPM+r.start)/15)*15;placeDump(x,m,true)});
  // move boxes with pointer
  tl.querySelectorAll(".blk.box").forEach(el=>{
    let sy=0,moved=false,orig=0,b=null;
    el.addEventListener("pointerdown",e=>{if(e.button!==0)return;b=day.boxes.find(x=>x.id===el.dataset.box);sy=e.clientY;orig=b.start;moved=false;el.setPointerCapture(e.pointerId)});
    el.addEventListener("pointermove",e=>{if(!b)return;const dy=e.clientY-sy;if(!moved&&Math.abs(dy)<5)return;moved=true;el.classList.add("dragging");
      const m=clamp(Math.round((orig+dy/PPM)/15)*15,r.start,r.end-b.dur);el.style.top=y(m)+"px";el.dataset.m=m});
    el.addEventListener("pointerup",e=>{if(!b)return;const bb=b;b=null;el.classList.remove("dragging");
      if(moved&&el.dataset.m!=null){bb.start=+el.dataset.m;const cf=conflictOf(k,bb);touch(k);render();if(cf)toast(`Overlaps ${PNAME[cf.key]}. Use "Fix conflicts" to move it after the prayer.`)}else openBox(bb)});
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openBox(day.boxes.find(x=>x.id===el.dataset.box))}});
  });
  document.querySelectorAll("[data-dump]").forEach(el=>el.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",el.dataset.dump)}));
}
function placeDump(x,from,exact){
  const k=viewKey,day=getDay(k);let st=from;
  if(!exact||conflictOf(k,{start:from,dur:x.est})||day.boxes.some(b=>overlaps(b,{start:from,dur:x.est})))st=findFree(k,x.est,from);
  if(st==null){toast("No free slot left today for "+durTxt(x.est));return false}
  day.boxes.push({id:uid(),title:x.text,pillar:x.pillar,start:st,dur:x.est,status:"pending",focus:0,priority:false,note:"",fromDump:x.id,sample:x.sample||undefined});
  touch(k);render();toast(`Boxed at ${fmt(st)}`);return true;
}

    ["craft","The day starts at Fajr","The hours after Fajr are the quietest and least interrupted. Hard craft and revenue work goes there first, before messages and meetings start.","Hadith: \"O Allah, bless my nation in its early mornings.\" (Abu Dawud, Tirmidhi)"],

const cite=(...ids)=>`<sup class="cite">${ids.map(i=>`<a href="#ref-${i}" data-act="cite" data-r="${i}">${i}</a>`).join(",")}</sup>`;
const EV={strong:["Strong","var(--good)"],moderate:["Moderate","var(--contrib)"],emerging:["Emerging","var(--warn)"],design:["Design claim","var(--craft)"]};
const evChip=k=>`<span class="ev-chip" style="--ev:${EV[k][1]}">${EV[k][0]}</span>`;
const COMPARE=[
  ["Origin and status",
   `A technique from agile project planning. Zao-Sanders's analysis of online productivity advice ranked it first of 100 tips${cite(1)}, and his 2024 book expands it${cite(2)}. The ranking measures how often the tip is recommended, not a controlled test of results.`,

function efficiencyLens(k){
  const day=S.days[k];if(!day)return null;const s=dayStats(k);if(s.comps.box==null)return null;
  const cp=s.byP.commerce.plan,deliv=cp?s.byP.commerce.done/cp:null;
  return Math.round((deliv==null?s.comps.box:.6*s.comps.box+.4*deliv)*100);
}
function vEvidence(){
  const k=viewKey,days=[...Array(7)].map((_,i)=>addDays(k,i-6));
  const rows=days.map(d=>({d,eff:efficiencyLens(d),bar:S.days[d]?dayStats(d).score:null}));
  const avg=a=>{const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((p,c)=>p+c,0)/v.length):null};
  const effAvg=avg(rows.map(r=>r.eff)),barAvg=avg(rows.map(r=>r.bar));
  return`<div class="grid">
  <section class="card thesis"><div class="eyebrow" style="color:#fde68a">Evidence review · ${REFS.length} sources</div>
    <h2>Two ways to measure a successful day</h2>

    <p class="q">Editor's note: timeboxing itself does not measure money. The money-and-efficiency lens comes from the work culture it is usually used in. The comparison below is between that lens and the Barakah lens, so the contention is tested fairly.</p></section>

  <section class="card"><div class="card-h"><div><div class="eyebrow">Compare and contrast</div><h2>Timebox vs Barakah Time Box</h2></div>
    <div class="legend">${Object.keys(EV).map(x=>evChip(x)).join("")}</div></div>
    <div class="tablewrap"><table class="evt"><thead><tr><th>Dimension</th><th>Conventional Timebox<br><span class="muted">latest findings</span></th><th>Barakah Time Box</th><th>What the research says</th></tr></thead><tbody>
    ${COMPARE.map(r=>`<tr><th scope="row">${r[0]}</th><td>${r[1]}</td><td class="bar-col">${r[2]}</td><td>${r[3]}<div style="margin-top:6px">${evChip(r[4])}</div></td></tr>`).join("")}
    </tbody></table></div>
    <p class="muted" style="font-size:.8rem;margin-bottom:0">Evidence labels: Strong = large studies or meta-analyses agree. Moderate = meta-analyses with small or mixed effects, or large surveys. Emerging = small or observational studies. Design claim = follows from established findings but has not been tested for this app.</p>
  </section>

  <div class="grid g-dash">
  <section class="card span-6"><div class="eyebrow">Where the contention holds</div><h2 style="margin-bottom:8px">Supported by the evidence</h2>
    <ul class="ev-list">
      <li>Money is an incomplete measure of a good life; well-being researchers recommend several indicators instead of one${cite(9,10,17)}.</li>
      <li>Unlimited efficiency carries real health costs; long hours and burn-out are documented harms${cite(12,13)}.</li>
      <li>Regular short breaks restore energy and reduce fatigue${cite(7)}, which the five prayers build in by design.</li>
      <li>Shorter, protected work schedules can hold revenue steady while lowering burn-out${cite(18)}.</li>
    </ul></section>
  <section class="card span-6"><div class="eyebrow">Where it needs your data</div><h2 style="margin-bottom:8px">Still to be tested</h2>
    <ul class="ev-list">
      <li>No study has yet compared a prayer-anchored timebox with a standard one. The app's daily records could provide that.</li>
      <li>Salat physiology studies are small (9 to 30 people) and partly reflect posture, not only prayer${cite(8)}.</li>
      <li>Religion and health studies are observational and cannot prove cause${cite(16)}.</li>
      <li>Night prayer can cost sleep unless bedtime moves earlier${cite(19,20)}.</li>
      <li>The best-known timeboxing ranking measures popularity, not effectiveness${cite(1)}.</li>
    </ul></section>

  <section class="card span-12"><div class="card-h"><div><div class="eyebrow">Draft for your scoring tab</div><h2>The same week under both lenses</h2></div>
    <div class="row"><span class="kpi-inline"><b class="num" style="color:var(--commerce)">${effAvg??"–"}</b> Efficiency lens avg</span><span class="kpi-inline"><b class="num" style="color:var(--creed)">${barAvg??"–"}</b> Barakah score avg</span></div></div>
    ${duoSvg(rows)}
    <div class="legend" style="margin-top:6px"><span><i class="dot" style="background:var(--commerce)"></i>Efficiency lens = 60% boxes completed + 40% commerce hours delivered vs planned</span><span><i class="dot" style="background:var(--creed)"></i>Barakah score = boxes, Salah, priorities, focus, plus Sunnah bonus</span></div>
    <p class="muted" style="font-size:.82rem;margin-bottom:0">This is a starting formula so you can see the two models diverge on real days. A day can score high on efficiency while missing prayers, or lower on efficiency while being well balanced. Replace the weights when you build the scoring tab.</p>
  </section></div>

  <section class="card" id="refs"><div class="eyebrow">References</div><h2 style="margin-bottom:10px">Sources cited</h2>
    <ol class="refs">${REFS.map(r=>`<li id="ref-${r.id}">${esc(r.t)} <a href="${r.u}" target="_blank" rel="noopener">Link</a></li>`).join("")}</ol>
    <p class="muted" style="font-size:.8rem;margin-bottom:0">Figures were checked against publisher pages, abstracts or reputable summaries in November 2026. Reference 5 is linked to a scholar search because its final journal details could not be confirmed; check it before you publish findings.</p>
  </section></div>`;
}
function duoSvg(rows){
  const W2=640,H=200,L=30,B=24,T=12,cw=(W2-L-6)/rows.length,y=v=>T+(H-T-B)*(1-v/100);
  let g="";for(const v of[0,25,50,75,100])g+=`<line x1="${L}" x2="${W2-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  let b="";rows.forEach((r,i)=>{const x=L+i*cw+cw*.18,w=cw*.3;
    if(r.eff!=null)b+=`<rect x="${x}" y="${y(r.eff)}" width="${w}" height="${H-B-y(r.eff)}" rx="4" fill="var(--commerce)"/><text x="${x+w/2}" y="${y(r.eff)-3}" text-anchor="middle" font-size="9.5" fill="var(--ink)">${r.eff}</text>`;
    if(r.bar!=null)b+=`<rect x="${x+w+3}" y="${y(r.bar)}" width="${w}" height="${H-B-y(r.bar)}" rx="4" fill="var(--creed)"/><text x="${x+w*1.5+3}" y="${y(r.bar)-3}" text-anchor="middle" font-size="9.5" fill="var(--ink)">${r.bar}</text>`;
    b+=`<text x="${x+w+1.5}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${dateOf(r.d).toLocaleDateString(undefined,{weekday:"short"})}</text>`});
  return`<svg viewBox="0 0 ${W2} ${H}" style="width:100%;height:auto" role="img" aria-label="Efficiency lens and Barakah score for the last seven days">${g}${b}</svg>`;
}

/* ---------- modal / toast ---------- */
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(html){closeModal();const b=document.createElement("div");b.className="modal-back";b.id="modalBack";b.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener("click",e=>{if(e.target===b)closeModal()});document.body.appendChild(b);const f=b.querySelector("input,button");if(f)f.focus();return b}
function closeModal(){const m=$("#modalBack");if(m)m.remove()}
function confirmBox(title,body,label,fn,danger){const m=modal(`<h2>${title}</h2><p class="muted">${body}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x="no">Cancel</button><button class="btn ${danger?"danger":"gold"}" data-x="yes">${label}</button></div>`);
  m.querySelector('[data-x="no"]').onclick=closeModal;m.querySelector('[data-x="yes"]').onclick=()=>{closeModal();fn()}}
function openBox(b,startMin){
  const k=viewKey,isNew=!b;const t=prayerTimes(k);
  b=b||{id:uid(),title:"",pillar:"commerce",start:startMin??findFree(k,60,startFrom(k))??t.fajr+30,dur:60,status:"pending",focus:0,priority:false,note:""};
  let pillar=b.pillar;
  const m=modal(`<h2>${isNew?"New time box":"Edit time box"}</h2>
  <form id="boxForm" style="display:grid;gap:12px">
    <label class="f">Title<input type="text" id="bTitle" value="${esc(b.title)}" placeholder="What will you do in this box?" required></label>
    <div><div class="eyebrow" style="margin-bottom:6px">Pillar</div><div class="pillar-pick">${Object.entries(PILLARS).map(([v,p])=>`<button type="button" class="${p.cls} ${v===pillar?"on":""}" data-pill="${v}"><i class="dot pc-dot"></i>${p.name}</button>`).join("")}</div></div>
    <div class="form-grid"><label class="f">Start<input type="time" id="bStart" step="900" value="${hhmm(b.start)}"></label>
      <label class="f">Length<select id="bDur">${[15,20,30,45,60,75,90,120,150,180,240].map(d=>`<option value="${d}" ${d===b.dur?"selected":""}>${durTxt(d)}</option>`).join("")}${[15,20,30,45,60,75,90,120,150,180,240].includes(b.dur)?"":`<option selected value="${b.dur}">${durTxt(b.dur)}</option>`}</select></label></div>
    <label class="row" style="gap:8px"><input type="checkbox" id="bPrio" ${b.priority?"checked":""}> Mark as a top-priority box <span class="star" style="color:var(--gold)">★</span></label>
    <label class="f">Notes<textarea id="bNote" rows="2">${esc(b.note)}</textarea></label>
    ${isNew?"":`<div><div class="eyebrow" style="margin-bottom:6px">Box check</div><div class="row">${statusSeg(b)}${starsHtml(b)}</div></div>`}
    <p id="bWarn" class="muted" style="margin:0;font-size:.82rem"></p>
    <div class="row" style="justify-content:space-between">${isNew?"<span></span>":`<button type="button" class="btn danger" id="bDel">${I.trash} Delete</button>`}<div class="row"><button type="button" class="btn" id="bCancel">Cancel</button><button class="btn primary" type="submit">${isNew?"Add box":"Save"}</button></div></div>
  </form>`);
  const warn=()=>{const c=conflictOf(k,{start:parseHM($("#bStart").value),dur:+$("#bDur").value});$("#bWarn").innerHTML=c?`<b style="color:var(--bad)">This overlaps ${PNAME[c.key]} (${fmt(c.start)} – ${fmt(c.start+c.dur)}).</b> It will be flagged until you move it.`:""};
  warn();$("#bStart").addEventListener("change",warn);$("#bDur").addEventListener("change",warn);
  m.querySelectorAll("[data-pill]").forEach(x=>x.onclick=()=>{pillar=x.dataset.pill;m.querySelectorAll("[data-pill]").forEach(y=>y.classList.toggle("on",y===x))});
  $("#bCancel").onclick=closeModal;
  if(!isNew)$("#bDel").onclick=()=>{const d=getDay(k);d.boxes=d.boxes.filter(x=>x.id!==b.id);touch(k);closeModal();render();toast("Box deleted")};
  $("#boxForm").addEventListener("submit",e=>{e.preventDefault();const title=$("#bTitle").value.trim();if(!title){$("#bTitle").focus();return}
    Object.assign(b,{title,pillar,start:parseHM($("#bStart").value),dur:+$("#bDur").value,priority:$("#bPrio").checked,note:$("#bNote").value});
    const d=getDay(k);if(isNew)d.boxes.push(b);touch(k);closeModal();render();toast(isNew?"Box added":"Box saved")});
}

/* ---------- PDF report ---------- */
function hexRgb(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const ascii=s=>String(s||"").replace(/[–—]/g,"-").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E]/g,"");
async function makePdf(){
  if(!window.jspdf){toast("The PDF library did not load. Check your connection and try again.");return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),W=210,M=14;let y=0;
  const keys=rangeKeys(repRange),stats=keys.map(k=>({k,s:S.days[k]?dayStats(k):null}));
  const scored=stats.filter(x=>x.s&&x.s.score!=null),avg=scored.length?Math.round(scored.reduce((a,x)=>a+x.s.score,0)/scored.length):null;
  const need=h=>{if(y+h>284){doc.addPage();y=16}};
  const fill=c=>doc.setFillColor(...hexRgb(c)),txt=c=>doc.setTextColor(...hexRgb(c));
  // header
  fill("#0f766e");doc.rect(0,0,W,38,"F");fill("#4c1d95");doc.rect(W*0.62,0,W*0.38,38,"F");fill("#f5b301");doc.rect(0,38,W,2,"F");
  txt("#ffffff");doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("Barakah Time Box Report",M,17);
  doc.setFont("helvetica","normal");doc.setFontSize(10);
  doc.text(ascii(`${repRange===1?longDate(viewKey):shortDate(keys[0])+" to "+shortDate(keys[keys.length-1])}  |  ${S.settings.city}  |  ${METHODS[S.settings.method].name}`),M,25);
  doc.text(ascii("Generated "+new Date().toLocaleString()),M,31);
  y=50;
  // summary tiles
  const tot=stats.reduce((a,x)=>{if(x.s){a.b+=x.s.boxes;a.d+=x.s.done;a.p+=x.s.prayersOk;a.al+=x.s.alignment||0;a.n++}return a},{b:0,d:0,p:0,al:0,n:0});
  const tiles=[["Average score",avg??"-","#4338ca"],["Boxes done",tot.d+"/"+tot.b,"#e39b06"],["Prayers on time",String(tot.p),"#0f9d76"],["Avg alignment",tot.n?Math.round(tot.al/tot.n):"-","#0a95d6"]];
  const tw=(W-2*M-9)/4;tiles.forEach((t,i)=>{const x=M+i*(tw+3);fill(t[2]);doc.roundedRect(x,y,tw,22,3,3,"F");txt("#ffffff");doc.setFontSize(8);doc.text(t[0].toUpperCase(),x+4,y+7);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text(String(t[1]),x+4,y+17);doc.setFont("helvetica","normal")});
  y+=32;
  // daily table
  txt("#141833");doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("Daily summary",M,y);y+=6;
  const cols=[["Date",34],["Score",18],["Grade",28],["Boxes",20],["Salah",20],["Priorities",22],["Focus",18],["Align",22]];
  const head=()=>{fill("#eef0fa");doc.rect(M,y-4.5,W-2*M,7,"F");doc.setFontSize(8.5);doc.setFont("helvetica","bold");txt("#5d6385");let x=M+2;cols.forEach(c=>{doc.text(c[0],x,y);x+=c[1]});y+=7;doc.setFont("helvetica","normal");txt("#141833")};
  head();
  const pc=v=>v==null?"-":Math.round(v*100)+"%";
  for(const {k,s} of stats){need(7);if(y===16)head();let x=M+2;const vals=s?[shortDate(k),s.score??"-",s.grade[0],s.done+"/"+s.boxes,pc(s.comps.salah),pc(s.comps.prio),pc(s.comps.focus),s.alignment??"-"]:[shortDate(k),"-","No data","","","","",""];
    vals.forEach((v,i)=>{if(i===1&&s&&s.score!=null){const c=s.score>=75?"#12a150":s.score>=50?"#e08a00":"#e0413a";fill(c);doc.roundedRect(x-1,y-3.8,12,5.2,2,2,"F");txt("#ffffff");doc.setFont("helvetica","bold");doc.text(String(v),x+1,y);doc.setFont("helvetica","normal");txt("#141833")}else doc.text(ascii(String(v)),x,y);x+=cols[i][1]});
    doc.setDrawColor(226,229,241);doc.line(M,y+2,W-M,y+2);y+=7}
  y+=4;
  // pillar totals
  need(40);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("Time by pillar (completed)",M,y);y+=6;
  const pt={};for(const p in PILLARS)pt[p]=0;stats.forEach(({s})=>{if(s)for(const p in PILLARS)pt[p]+=s.byP[p].done});
  const maxP=Math.max(1,...Object.values(pt));doc.setFontSize(9);doc.setFont("helvetica","normal");
  for(const p in PILLARS){need(7);txt("#141833");doc.text(PILLARS[p].name,M,y);fill("#eef0fa");doc.roundedRect(M+30,y-3.5,120,4.5,2,2,"F");fill(PILLARS[p].hex);doc.roundedRect(M+30,y-3.5,Math.max(1,120*pt[p]/maxP),4.5,2,2,"F");doc.text(durTxt(Math.round(pt[p])),M+154,y);y+=7}
  y+=4;
  // day details
  const detailKeys=stats.filter(x=>x.s).map(x=>x.k).slice(-(repRange===30?7:repRange)).reverse();
  for(const k of detailKeys){const d=S.days[k],s=dayStats(k),t=prayerTimes(k);
    need(30);fill("#0f766e");doc.roundedRect(M,y-5,W-2*M,8,2,2,"F");txt("#ffffff");doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(ascii(longDate(k)+"   Score "+(s.score??"-")+"  "+s.grade[0]),M+3,y);y+=8;
    txt("#141833");doc.setFontSize(9);doc.setFont("helvetica","normal");
    if(d.intention){need(6);doc.setFont("helvetica","italic");doc.text(doc.splitTextToSize(ascii("Intention: "+d.intention),W-2*M),M,y);y+=6;doc.setFont("helvetica","normal")}
    need(6);doc.text(ascii("Salah: "+FARD.map(p=>PNAME[p]+" "+fmt(t[p])+" "+(PSTAT.find(x=>x[0]===d.prayers[p])||["","not logged"])[1]).join("  |  ")),M,y,{maxWidth:W-2*M});y+=d.prayers?10:6;
    need(6);doc.text(ascii("Night & voluntary: Tahajjud "+(d.nafl.tahajjud?"yes":"no")+"  |  Duha "+(d.nafl.duha?"yes":"no")+"  |  Integrity checks "+CONDUCT.filter(c=>d.conduct[c[0]]).length+"/5"),M,y);y+=6;
    const pr=d.priorities.filter(p=>p.t.trim());if(pr.length){need(6);doc.text(ascii("Priorities: "+pr.map(p=>(p.d?"[x] ":"[ ] ")+p.t).join("   ")),M,y,{maxWidth:W-2*M});y+=pr.length>1?10:6}
    for(const b of d.boxes.slice().sort((a,c)=>a.start-c.start)){need(6);fill(PILLARS[b.pillar].hex);doc.circle(M+1.5,y-1.2,1.3,"F");
      const sc={done:"#12a150",partial:"#e08a00",missed:"#e0413a",pending:"#9aa0bd"}[b.status];
      doc.text(ascii(fmt(b.start)+"-"+fmt(b.start+b.dur)),M+5,y);doc.text(doc.splitTextToSize(ascii((b.priority?"* ":"")+b.title),100)[0],M+42,y);
      txt(sc);doc.setFont("helvetica","bold");doc.text(b.status.toUpperCase(),M+148,y);doc.setFont("helvetica","normal");txt("#141833");doc.text(b.focus?("Focus "+b.focus+"/5"):"",M+168,y);y+=5.5}
    if(d.reflection){need(8);doc.setFont("helvetica","italic");const lines=doc.splitTextToSize(ascii("Reflection: "+d.reflection),W-2*M);need(lines.length*4.5);doc.text(lines,M,y);y+=lines.length*4.5;doc.setFont("helvetica","normal")}
    y+=6}
  // footer
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);txt("#5d6385");doc.text("Score = Boxes 35% + Salah 30% + Priorities 20% + Focus 15% + Tahajjud 5 + Duha 3 (max 100)",M,292);doc.text(i+"/"+n,W-M,292,{align:"right"})}
  const name="barakah-timebox-"+(repRange===1?viewKey:keys[0]+"-to-"+keys[keys.length-1])+".pdf";
  await deliver(name,doc.output("blob"),()=>doc.save(name));
}
async function deliver(filename,blob,fallback){
  try{const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){try{await dl.save({filename,data:blob});toast("Saved "+filename)}catch(e){if(e&&e.code!=="declined")toast("Could not save the file here ("+(e.code||"error")+").")}return}}catch(e){}
  try{if(fallback)fallback();else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}toast("Downloaded "+filename)}catch(e){toast("Downloads are blocked in this view.")}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act,k=viewKey;
  const findBox=id=>getDay(k).boxes.find(b=>b.id===id);
  switch(a){
    case"day":viewKey=addDays(viewKey,+el.dataset.d);render();break;
    case"today":viewKey=todayKey();render();break;
    case"theme":{const order=["auto","light","dark"];S.settings.theme=order[(order.indexOf(S.settings.theme)+1)%3];applyTheme();dirtySettings=true;save();toast("Theme: "+({auto:"match system",light:"light",dark:"dark"})[S.settings.theme]);if(route==="setup")render();break}
    case"bstatus":{const b=findBox(el.dataset.id);if(!b)return;b.status=b.status===el.dataset.v?"pending":el.dataset.v;if(b.status==="missed")b.focus=0;touch(k);if($("#modalBack")){el.parentElement.querySelectorAll("button").forEach(x=>{x.classList.toggle("on",x.dataset.v===b.status)});} render2();break}
    case"bfocus":{const b=findBox(el.dataset.id);if(!b)return;b.focus=b.focus===+el.dataset.v?0:+el.dataset.v;touch(k);if($("#modalBack"))el.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.v<=b.focus));render2();break}
    case"prioDone":getDay(k).priorities[+el.dataset.i].d=el.checked;touch(k,true);render();break;
    case"pstat":{const d=getDay(k),p=el.dataset.p;d.prayers[p]=d.prayers[p]===el.dataset.v?undefined:el.dataset.v;if(!d.prayers[p])delete d.prayers[p];touch(k,true);render();break}
    case"nafl":getDay(k).nafl[el.dataset.n]=el.checked;touch(k,true);render();break;
    case"conduct":getDay(k).conduct[el.dataset.c]=el.checked;touch(k,true);render();break;
    case"newBox":openBox(null);break;
    case"boxit":{const x=getDay(k).dump.find(d=>d.id===el.dataset.id);if(x)placeDump(x,startFrom(k),false);break}
    case"delDump":{const d=getDay(k);d.dump=d.dump.filter(x=>x.id!==el.dataset.id);touch(k);render();break}
    case"autobox":{const d=getDay(k),boxed=new Set(d.boxes.map(b=>b.fromDump));const todo=d.dump.filter(x=>!boxed.has(x.id));if(!todo.length){toast("Everything in the brain dump is already boxed");break}
      const order=["commerce","craft","creed","contrib","care"];todo.sort((a,b)=>order.indexOf(a.pillar)-order.indexOf(b.pillar));let n=0;
      for(const x of todo){const st=findFree(k,x.est,startFrom(k));if(st==null)break;d.boxes.push({id:uid(),title:x.text,pillar:x.pillar,start:st,dur:x.est,status:"pending",focus:0,priority:false,note:"",fromDump:x.id,sample:x.sample||undefined});n++}
      touch(k);render();toast(n?`Boxed ${n} task${n>1?"s":""} around your prayers`:"No free time left today");break}
    case"fixAll":{const d=getDay(k);let n=0;for(const b of d.boxes){const c=conflictOf(k,b);if(c){const st=findFree(k,b.dur,c.start+c.dur,b.id);if(st!=null){b.start=st;n++}}}touch(k);render();toast(`Moved ${n} box${n===1?"":"es"} out of prayer time`);break}
    case"askRemoveSample":confirmBox("Remove sample data?","This deletes the seven example days and example tasks. Anything you added yourself stays.","Remove sample data",()=>{removeSample();render();toast("Sample data removed")});break;
    case"loadSample":{seedSample();S.settings.sampleDismissed=false;dirtySettings=true;Object.keys(S.days).forEach(x=>dirty.add(x));save();render();toast("Sample data loaded");break}
    case"askReset":confirmBox("Erase everything?","All boxes, prayers, notes and settings will be deleted from this device"+(dbApi?" and your account":"")+". This cannot be undone.","Erase everything",()=>{Object.keys(S.days).forEach(x=>dirty.add(x));S.days={};S.settings=Object.assign(defaultSettings(),{seeded:true,sampleDismissed:true});dirtySettings=true;save();applyTheme();render();toast("All data erased")},true);break;
    case"cite":{e.preventDefault();const t=document.getElementById("ref-"+el.dataset.r);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.style.background="color-mix(in srgb,var(--gold) 22%,transparent)";setTimeout(()=>t.style.background="",1800)}break}
    case"range":repRange=+el.dataset.n;render();break;
    case"pdf":makePdf();break;
    case"exportJson":deliver("barakah-timebox-backup-"+todayKey()+".json",new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));break;
    case"exportCsv":{const rows=[["date","start","end","title","pillar","status","focus","priority"]];Object.keys(S.days).sort().forEach(d=>S.days[d].boxes.forEach(b=>rows.push([d,hhmm(b.start),hhmm(b.start+b.dur),b.title,PILLARS[b.pillar].name,b.status,b.focus,b.priority?"yes":"no"])));
      deliver("barakah-timebox-boxes.csv",new Blob([rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}));break}
    case"importJson":$("#importFile").click();break;
    case"geo":{if(!navigator.geolocation){toast("Location is not available here. Enter coordinates instead.");break}
      navigator.geolocation.getCurrentPosition(p=>{Object.assign(S.settings,{lat:+p.coords.latitude.toFixed(4),lng:+p.coords.longitude.toFixed(4),city:"",guessed:false});dirtySettings=true;save();render();toast("Location set")},()=>toast("Location is blocked here. Pick a city or enter coordinates."));break}
  }
});
function render2(){if($("#modalBack")){const m=$("#modalBack");m.remove();render();document.body.appendChild(m)}else render()}
document.addEventListener("submit",e=>{if(e.target.id==="dumpForm"){e.preventDefault();const t=$("#dumpText").value.trim();if(!t)return;getDay(viewKey).dump.unshift({id:uid(),text:t,pillar:$("#dumpPillar").value,est:+$("#dumpEst").value});touch(viewKey);render();$("#dumpText").focus()}});
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset.bind)return;const d=getDay(viewKey);
  if(el.dataset.bind==="prio")d.priorities[+el.dataset.i].t=el.value;else d[el.dataset.bind]=el.value;d.touched=true;dirty.add(viewKey);save()});
document.addEventListener("change",e=>{const el=e.target,p=el.dataset.set;if(!p)return;const s=S.settings;let v=el.type==="checkbox"?el.checked:el.value;
  if(p==="city"){const c=CITIES.find(c=>c[0]===v);if(c)Object.assign(s,{city:c[0],lat:c[1],lng:c[2],method:c[3]});else s.city="";s.guessed=false}
  else if(p==="lat"||p==="lng"){s[p]=+v;s.city="";s.guessed=false}
  else if(p.startsWith("dur."))s.dur[p.slice(4)]=+v;
  else if(p==="h24")s.h24=v==="true";
  else if(["wudu","jumuahDur"].includes(p))s[p]=+v;
  else s[p]=v;
  dirtySettings=true;save();applyTheme();render();toast("Settings saved")});
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.settings||!o.days)throw 0;S.settings=Object.assign(defaultSettings(),o.settings);S.days=o.days;dirtySettings=true;Object.keys(S.days).forEach(k=>dirty.add(k));save();applyTheme();render();toast("Backup imported")}catch(err){toast("That file is not a Barakah Time Box backup.")}};r.readAsText(f);e.target.value=""});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function applyTheme(){const t=S.settings.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
function onRoute(){const h=location.hash.slice(1);route=["dashboard","timebox","salah","model","evidence","reports","setup"].includes(h)?h:"dashboard";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",onRoute);

/* ---------- boot ---------- */
const had=loadLocal();
if(!had||(!S.settings.seeded&&!S.settings.sampleDismissed))seedSample();
applyTheme();onRoute();
setInterval(tickHeader,1000);
let lastSeg=currentSeg(),lastDay=todayKey();
setInterval(()=>{if(currentSeg()!==lastSeg||todayKey()!==lastDay){lastSeg=currentSeg();if(todayKey()!==lastDay&&viewKey===lastDay)viewKey=todayKey();lastDay=todayKey()}if(!$("#modalBack")&&!document.activeElement.matches("input,textarea,select"))render()},60000);
connectDb();
})();
</script>
